name: Build Rust Engine (Android)

on:
  workflow_dispatch:

env:
  RUST_VERSION: stable

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 26.3.11579262

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true
          profile: minimal

      - name: Install Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build UniFFI bindgen CLI launcher
        run: cargo build --release --manifest-path rustEngine/bindgen-cli/Cargo.toml

      - name: Build Rust library for Android
        run: |
          cd rustEngine
          cargo ndk --ndk-path $ANDROID_NDK_HOME \
            --platform 21 \
            --target arm64-v8a --target x86_64 \
            --output-dir ../androidApp/app/src/main/jniLibs \
            build --release --lib --no-default-features

      - name: Generate Kotlin bindings
        run: |
          mkdir -p bindings-tmp
          ./rustEngine/target/release/uniffi-bindgen-cli generate \
            --language kotlin \
            --library androidApp/app/src/main/jniLibs/arm64-v8a/libapp_lib.so \
            --out-dir bindings-tmp \
            --no-format

      - name: Move Kotlin wrappers to expected package
        run: |
          mkdir -p androidApp/app/src/main/java/com/telebox/app/engine
          cp bindings-tmp/*.kt androidApp/app/src/main/java/com/telebox/app/engine/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-artifacts
          path: |
            androidApp/app/src/main/jniLibs/
            androidApp/app/src/main/java/com/telebox/app/engine/
          if-no-files-found: error
