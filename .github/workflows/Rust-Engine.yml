name: Build Rust Engine (Android)

on:
  workflow_dispatch:

env:
  RUST_VERSION: stable
  ANDROID_NDK_VERSION: 26.3.11579262

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Manual NDK download (Option 2 – known to work)
      - name: Download and extract NDK
        run: |
          NDK_VERSION=${{ env.ANDROID_NDK_VERSION }}
          NDK_ZIP=android-ndk-r26d-linux.zip
          curl -L -o $NDK_ZIP "https://dl.google.com/android/repository/$NDK_ZIP"
          unzip -q $NDK_ZIP -d $HOME
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true
          profile: minimal

      - name: Install Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Install and verify cargo-ndk
        run: |
          cargo install cargo-ndk --force
          cargo ndk --help

      - name: Build Rust library for Android
        run: |
          cd rustEngine
          cargo ndk \
            --platform 21 \
            --target arm64-v8a --target x86_64 \
            --output-dir ../androidApp/app/src/main/jniLibs \
            build --release --lib --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # --- Verify the library exists and has UniFFI symbols ---
      - name: Check library file
        run: |
          echo "Library size and type:"
          ls -la androidApp/app/src/main/jniLibs/arm64-v8a/
          file androidApp/app/src/main/jniLibs/arm64-v8a/libapp_lib.so
          echo "Looking for UniFFI symbols..."
          nm -D androidApp/app/src/main/jniLibs/arm64-v8a/libapp_lib.so | grep -i uniffi || echo "WARNING: No UniFFI symbols found!"
        
      - name: Build UniFFI bindgen CLI
        run: cargo build --release --manifest-path rustEngine/bindgen-cli/Cargo.toml
      
      - name: List built binary
        run: ls -la rustEngine/target/release/uniffi-bindgen-cli
      
      - name: Check bindgen CLI help
        run: |
          cd rustEngine
          ./target/release/uniffi-bindgen-cli generate --help
      
      - name: Generate Kotlin bindings
        run: |
          mkdir -p bindings-tmp
          cd rustEngine
          ./target/release/uniffi-bindgen-cli generate \
            --language kotlin \
            --library "$GITHUB_WORKSPACE/androidApp/app/src/main/jniLibs/arm64-v8a/libapp_lib.so" \
            --out-dir "$GITHUB_WORKSPACE/bindings-tmp" \
            --no-format
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
      
      - name: Check generated bindings
        run: |
          echo "Contents of bindings-tmp:"
          ls -la bindings-tmp/
          echo "Kotlin files:"
          find bindings-tmp -name "*.kt" -type f || echo "No .kt files generated"

      # --- Move Kotlin wrappers to expected package ---
      - name: Move Kotlin wrappers
        run: |
          mkdir -p androidApp/app/src/main/java/com/telebox/app/engine
          if [ -n "$(find bindings-tmp -name '*.kt' -print -quit)" ]; then
            find bindings-tmp -name '*.kt' -exec cp {} androidApp/app/src/main/java/com/telebox/app/engine/ \;
          else
            echo "No .kt files to copy – generation failed!"
            exit 1
          fi

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-artifacts
          path: |
            androidApp/app/src/main/jniLibs/
            androidApp/app/src/main/java/com/telebox/app/engine/
          if-no-files-found: error
          
