name: Build Rust Engine (Android)

on:
  workflow_dispatch:   # manual trigger only

env:
  RUST_VERSION: stable
  ANDROID_NDK_VERSION: 26.3.11579262   # r26d

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- START INSTANT NDK CACHE LAYER ---
      - name: Check Android NDK Cache
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-r26d
          key: ${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Download NDK (Runs only if Cache Misses)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_ZIP=android-ndk-r26d-linux.zip
          curl -L -o $NDK_ZIP "https://google.com"
          unzip -q $NDK_ZIP -d $HOME
          rm $NDK_ZIP

      - name: Set NDK Environment Path
        run: echo "ANDROID_NDK_HOME=$HOME/android-ndk-r26d" >> $GITHUB_ENV
      # --- END INSTANT NDK CACHE LAYER ---

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install and verify cargo-ndk
        run: |
          cargo install cargo-ndk
          cargo ndk --help

      - name: Build Rust library for Android
        run: |
          cd rustEngine
          cargo ndk \
            --platform 21 \
            --target arm64-v8a --target x86_64 \
            --output-dir ../androidApp/app/src/main/jniLibs \
            build --release --lib --no-default-features

      - name: Build UniFFI bindgen CLI
        run: cargo build --release --manifest-path rustEngine/bindgen-cli/Cargo.toml

      - name: Verify library file
        run: |
          echo "Checking library existence..."
          ls -la androidApp/app/src/main/jniLibs/arm64-v8a/
          file androidApp/app/src/main/jniLibs/arm64-v8a/libapp_lib.so

      - name: Generate Kotlin bindings
        run: |
          mkdir -p bindings-tmp
          cd rustEngine
          ./target/release/uniffi-bindgen-cli generate \
            --language kotlin \
            --library "$GITHUB_WORKSPACE/androidApp/app/src/main/jniLibs/arm64-v8a/libapp_lib.so" \
            --out-dir "$GITHUB_WORKSPACE/bindings-tmp" \
            --no-format \
            --verbose
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: List generated files
        run: |
          echo "Contents of bindings-tmp:"
          ls -la bindings-tmp/
          echo "Kotlin files:"
          find bindings-tmp -name "*.kt" -type f || echo "No .kt files found"

      - name: Move Kotlin wrappers to expected package
        run: |
          mkdir -p androidApp/app/src/main/java/com/telebox/app/engine
          cp bindings-tmp/*.kt androidApp/app/src/main/java/com/telebox/app/engine/

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-artifacts
          path: |
            androidApp/app/src/main/jniLibs/
            androidApp/app/src/main/java/com/telebox/app/engine/
          if-no-files-found: error
          
