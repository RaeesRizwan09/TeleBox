name: Build Android APK (64-bit Unsigned)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Wrapper and Build APK
        run: |
          cd androidApp
          # Generate the missing gradlew script using system Gradle
          gradle wrapper
          
          # Make it executable
          chmod +x gradlew
          
          # Build the unsigned release APK
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telebox-release-unsigned
          path: androidApp/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          
