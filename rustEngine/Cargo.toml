[package]
name = "telegramdrive-engine"
version = "1.3.2"
description = "Turn your Telegram account into an unlimited, secure cloud storage drive. Native mobile engine built with Rust and UniFFI over the grammers MTProto client."
authors = ["Cameron Amer"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["cdylib", "rlib"]

[features]
# Local HTTP streaming server used by the legacy desktop shell. It is not
# compiled into Android/iOS mobile builds (pipeline passes --no-default-features).
default = ["streaming-server"]
streaming-server = ["dep:actix-web", "dep:actix-cors", "dep:actix-rt", "dep:async-stream"]

[dependencies]
# -- MTProto (Telegram) client runtime ---------------------------------------
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-tl-types = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }

tokio = { version = "1", features = ["full"] }

# -- Foreign-function interface ----------------------------------------------
uniffi = { version = "0.28", features = ["tokio"] }

# -- Serialization / helpers -------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.21"
log = "0.4"
env_logger = "0.11"
rand = "0.8"

# -- Optional desktop streaming server (mobile builds disable this feature) --
actix-web = { version = "4", optional = true }
actix-cors = { version = "0.7", optional = true }
actix-rt = { version = "2", optional = true }
async-stream = { version = "0.3", optional = true }

[dev-dependencies]
uniffi_bindgen = "0.28.3"
